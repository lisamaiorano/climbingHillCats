<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cuoricini in salita 💗</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#bfe9ff;color:#42283a}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none}
  #hud[hidden]{display:none}
  .pill{background:#ffffffe0;border:2px solid #fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;box-shadow:0 4px 15px #00000018;white-space:nowrap}
  #fuelBar{display:inline-block;width:54px;height:9px;border-radius:9px;background:#ffd9e8;vertical-align:middle;margin-left:4px;overflow:hidden}
  #face{width:30px;height:30px;object-fit:contain;vertical-align:middle}
  #fuelFill{display:block;height:100%;width:100%;background:#ff4f8b}
  #menu{position:fixed;inset:0;display:grid;place-items:center;background:#fff1f7dd;padding:16px}
  #menu[hidden]{display:none}
  .card{background:#fff;border-radius:24px;padding:22px;max-width:440px;width:100%;text-align:center;box-shadow:0 18px 60px #5b304433}
  h1{font-size:25px;margin:0 0 6px}
  p{margin:6px 0}
  #result{font-weight:800;color:#d6407a;min-height:1.2em}
  .cats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}
  button{border:0;border-radius:15px;padding:12px 14px;background:#ffd0e4;color:#42283a;font-weight:800;font-size:15px;font-family:inherit}
  button.selected{background:#ff78ad;color:#fff}
  #start{background:#6f4bf2;color:#fff;font-size:18px;padding:14px 28px;margin-top:4px}
  .small{font-size:13px;opacity:.7}
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
  .touchBtn{pointer-events:auto;touch-action:none;width:42vw;max-width:210px;height:84px;border-radius:26px;background:#ffffffb8;border:3px solid #fff;font-size:20px;box-shadow:0 6px 18px #0000001f}
  .touchBtn.on{background:#ff78ad;color:#fff}
  @media (pointer:coarse){#touch{display:flex}.kbd{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" hidden>
  <div class="pill">💗 <span id="hearts">0</span></div>
  <div class="pill"><img id="face" src="faccina1.PNG" alt=""><span id="fuelBar"><span id="fuelFill"></span></span></div>
  <div class="pill">🏆 <span id="distance">0</span> m</div>
</div>
<div id="menu">
  <div class="card">
    <h1>Cuoricini in salita 💗</h1>
    <p id="result"></p>
    <p>Scegli il tuo gattino e porta più lontano possibile il nostro piccolo amore.</p>
    <div class="cats">
      <button class="cat selected" data-cat="Matisse">🐱 Matisse</button>
      <button class="cat" data-cat="John Doe">😺 John Doe</button>
      <button class="cat" data-cat="Pipo">😸 Pipo</button>
    </div>
    <button id="start">Inizia 💗</button>
    <p class="small"><span class="kbd">D / → gas · A / ← freno · in aria inclina il gattino<br></span>Raccogli i cuoricini: ricaricano la faccina (la “benzina”)</p>
    <p class="small" id="best"></p>
  </div>
</div>
<div id="touch">
  <button class="touchBtn" id="left">◀ Freno</button>
  <button class="touchBtn" id="right">Gas ▶</button>
</div>

<script>
/*
  terrainHeight(x) è l'unica fonte del terreno: la usano sia il disegno sia la fisica.
  Per cambiare colline modifica solo quella funzione.
  Per usare le tue immagini: sostituisci drawCat() e l'emoji #face nell'HTML.
*/
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const CATS={Matisse:["#f3a9c8","#ffd1e4"],"John Doe":["#b9c4f5","#dde3ff"],Pipo:["#ffd08a","#ffe8c2"]};
const G=1400, G_SLOPE=1000, ENGINE=1000, BRAKE=900, MAXV=1500;
let dpr=1, cssW=0, cssH=0, scale=1, viewW=640, viewH=460;
let running=false, selectedCat="Matisse", camX=0, camY=0;
let hearts=0, fuel=100, distance=0, best=0, last=0, t0=0;
const keys={left:false,right:false};
const p={x:180,y:0,vx:0,vy:0,s:0,angle:0,av:0,air:false};
const collected=new Set(); let collectibles=[];
try{best=+localStorage.getItem("cuoricini-best")||0}catch(e){}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  cssW=window.innerWidth; cssH=window.innerHeight;
  canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr);
  scale=Math.min(cssW/640,cssH/460);
  viewW=cssW/scale; viewH=cssH/scale;
}
addEventListener("resize",resize); resize();

// ---------- TERRENO ----------
function terrainHeight(x){
  const k=0.9+Math.min(1,x/14000)*0.75;           // colline sempre più ripide
  const hills=Math.sin(x*0.0042)*40+Math.sin(x*0.0105+1.4)*20+Math.sin(x*0.021+0.8)*6+Math.sin(x*0.0017-0.7)*55;
  const flatStart=Math.min(1,Math.max(0,(x-250)/500)); // partenza piatta
  return 485 - x*0.07 + hills*k*flatStart;           // "in salita": il terreno sale piano piano
}
function probe(x){ // altezza del corpo e angolo calcolati sotto le due ruote
  const hr=terrainHeight(x-28), hf=terrainHeight(x+28);
  const a=Math.atan2(hf-hr,56);
  return {a, y:(hr+hf)/2-42/Math.cos(a)};
}
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};

function buildCollectibles(){
  collectibles=[];
  for(let x=520,i=0;x<120000;x+=250,i++){
    collectibles.push({x,y:terrainHeight(x)-60-Math.abs(Math.sin(i*1.7))*40,id:i});
  }
}

// ---------- INPUT ----------
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowleft","arrowright","a","d"," "].includes(k)) e.preventDefault();
  if(k==="arrowleft"||k==="a") keys.left=true;
  if(k==="arrowright"||k==="d") keys.right=true;
  if((k===" "||k==="enter")&&!running) startGame();
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a") keys.left=false;
  if(k==="arrowright"||k==="d") keys.right=false;
});
for(const key of ["left","right"]){
  const b=document.getElementById(key);
  const set=v=>{keys[key]=v;b.classList.toggle("on",v)};
  b.addEventListener("pointerdown",e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}set(true)});
  for(const ev of ["pointerup","pointercancel","lostpointercapture"]) b.addEventListener(ev,()=>set(false));
}
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("blur",()=>{keys.left=keys.right=false});

document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".cat").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected"); selectedCat=b.dataset.cat;
});
document.getElementById("start").onclick=startGame;

function startGame(){
  running=true;
  document.getElementById("menu").hidden=true;
  document.getElementById("hud").hidden=false;
  hearts=0; fuel=100; distance=0;
  p.x=180; p.s=0; p.vx=0; p.vy=0; p.av=0; p.air=false;
  const q=probe(p.x); p.y=q.y; p.angle=q.a;
  camX=p.x-viewW*0.3; camY=p.y-viewH*0.62;
  collected.clear(); buildCollectibles();
}
function endGame(msg){
  running=false;
  keys.left=keys.right=false;
  document.getElementById("touch").querySelectorAll(".touchBtn").forEach(b=>b.classList.remove("on"));
  if(distance>best){best=distance;try{localStorage.setItem("cuoricini-best",best)}catch(e){}}
  document.getElementById("result").textContent=`${msg} · ${distance} m · 💗 ${hearts}`;
  document.getElementById("best").textContent=`Record: ${best} m`;
  document.getElementById("hud").hidden=true;
  setTimeout(()=>{document.getElementById("menu").hidden=false},500);
}
document.getElementById("best").textContent=best?`Record: ${best} m`:"";

// ---------- FISICA ----------
function step(dt){
  if(!p.air){
    const q0=probe(p.x), a=q0.a;
    let acc=G_SLOPE*Math.sin(a);
    if(keys.right&&fuel>0) acc+=ENGINE;
    if(keys.left) acc-= p.s>0?BRAKE:180;
    p.s+=acc*dt;
    p.s*=Math.exp(-0.3*dt);
    p.s=Math.max(-200,Math.min(MAXV,p.s));
    const vy0=p.s*Math.sin(a);
    let nx=p.x+p.s*Math.cos(a)*dt;
    if(nx<60){nx=60;p.s=Math.max(0,p.s)}
    const q=probe(nx);
    const yBall=p.y+vy0*dt+0.5*G*dt*dt;
    if(yBall<q.y-0.25 && p.s>70){          // il terreno sparisce sotto: decollo
      p.air=true; p.vx=p.s*Math.cos(a); p.vy=vy0; p.av=0; p.x=nx; p.y=yBall;
    }else{
      p.x=nx; p.y=q.y;
      p.angle+=wrap(q.a-p.angle)*Math.min(1,dt*10);
    }
  }else{
    p.vy+=G*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(keys.right) p.av+=14*dt;           // in aria: destra = in avanti
    if(keys.left) p.av-=14*dt;
    p.av=Math.max(-5,Math.min(5,p.av))*Math.exp(-0.4*dt);
    p.angle+=p.av*dt;
    const q=probe(p.x);
    if(p.y>=q.y){                         // atterraggio
      if(Math.abs(wrap(p.angle-q.a))>0.9){ endGame("Capovolto! 🙈"); return; }
      p.air=false;
      p.s=Math.max(-200,Math.min(MAXV,p.vx*Math.cos(q.a)+p.vy*Math.sin(q.a)));
      p.y=q.y; p.av=0;
    }
  }
  fuel-= dt*(keys.right?3.2:0.8);
  fuel=Math.max(0,fuel);
  distance=Math.max(distance,Math.floor((p.x-180)/10));

  for(const c of collectibles){
    if(collected.has(c.id)||c.x<p.x-120) continue;
    if(c.x>p.x+120) break;
    const dx=c.x-p.x, dy=c.y-p.y;
    if(dx*dx+dy*dy<60*60){collected.add(c.id);hearts++;fuel=Math.min(100,fuel+7)}
  }
  if(fuel<=0 && !p.air && Math.abs(p.s)<12) endGame("Faccina scarica 🥺");
}
function physics(dt){
  const n=3; for(let i=0;i<n&&running;i++) step(dt/n);
  const k=Math.min(1,dt*8);
  camX+=((p.x-viewW*0.3)-camX)*k;
  camY+=((p.y-viewH*0.62)-camY)*k;
}

// ---------- DISEGNO ----------
function drawSky(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,cssH);
  g.addColorStop(0,"#b9e9ff"); g.addColorStop(1,"#fff0d8");
  ctx.fillStyle=g; ctx.fillRect(0,0,cssW,cssH);
  ctx.fillStyle="#fff4ad"; ctx.beginPath(); ctx.arc(cssW*0.8,cssH*0.16,34,0,7); ctx.fill();
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  const layers=[["#b5d9bd",.12,.66,34,.006],["#9ec9a7",.25,.74,26,.005]];
  for(const [col,par,base,amp,fr] of layers){
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,viewH);
    for(let x=0;x<=viewW+10;x+=10){
      const wx=x+camX*par;
      ctx.lineTo(x,viewH*base-camY*0.04+Math.sin(wx*fr)*amp+Math.sin(wx*fr*2.3)*amp*.4);
    }
    ctx.lineTo(viewW,viewH); ctx.closePath(); ctx.fill();
  }
}
function drawHeart(x,y,s){
  ctx.fillStyle="#ff4f8b"; ctx.beginPath();
  ctx.moveTo(x,y+s*.9);
  ctx.bezierCurveTo(x-s*1.4,y-s*.05,x-s*.7,y-s*1.25,x,y-s*.55);
  ctx.bezierCurveTo(x+s*.7,y-s*1.25,x+s*1.4,y-s*.05,x,y+s*.9);
  ctx.fill();
}
function drawTerrain(){
  ctx.save(); ctx.translate(-camX,-camY);
  const x0=Math.floor(camX/10)*10-20, x1=camX+viewW+30, bottom=camY+viewH+20;
  ctx.fillStyle="#72b85d"; ctx.beginPath(); ctx.moveTo(x0,bottom);
  for(let x=x0;x<=x1;x+=10) ctx.lineTo(x,terrainHeight(x));
  ctx.lineTo(x1,bottom); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#4e8f4a"; ctx.lineWidth=7; ctx.lineJoin="round"; ctx.beginPath();
  for(let x=x0;x<=x1;x+=10){const y=terrainHeight(x); x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  ctx.stroke();
  ctx.fillStyle="#fff";
  for(let x=Math.floor(x0/90)*90;x<x1;x+=90){ctx.beginPath();ctx.arc(x,terrainHeight(x)+8,3,0,7);ctx.fill()}
  for(const c of collectibles){
    if(c.x<x0-30) continue; if(c.x>x1+30) break;
    if(!collected.has(c.id)) drawHeart(c.x,c.y,15);
  }
  ctx.restore();
}
const CAT_IMGS = {
  "Matisse": "matisse.PNG",
  "John Doe": "john.PNG",
  "Pipo": "pipo.PNG"
};
const CAT_W = 130;          // larghezza del gattino nel gioco
const DRAW_WHEELS = true;   // metti false se le ruote sono già nel tuo disegno
const FLIP = false;         // metti true se il tuo gatto guarda verso sinistra

const catImg = {};
for (const [name, src] of Object.entries(CAT_IMGS)) {
  const im = new Image(); im.src = src; catImg[name] = im;
}

function drawCat(){
  ctx.save();
  ctx.translate(-camX+p.x, -camY+p.y);
  ctx.rotate(p.angle);
  if (FLIP) ctx.scale(-1, 1);
  const im = catImg[selectedCat];
  if (im.complete && im.naturalWidth) {
    const h = CAT_W * im.naturalHeight / im.naturalWidth;
    ctx.drawImage(im, -CAT_W/2, 42 - h, CAT_W, h);   // il fondo dell'immagine tocca il terreno
  }
  if (DRAW_WHEELS) {
    for (const wx of [-28, 28]) {
      ctx.fillStyle = "#5b5361"; ctx.beginPath(); ctx.arc(wx, 29, 13, 0, 7); ctx.fill();
      ctx.fillStyle = "#e9dce5"; ctx.beginPath(); ctx.arc(wx, 29, 5, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}
function draw(){
  drawSky(); drawTerrain(); drawCat();
  document.getElementById("hearts").textContent=hearts;
  document.getElementById("distance").textContent=distance;
  document.getElementById("fuelFill").style.width=fuel+"%";
  const f=document.getElementById("face");
  f.style.opacity=0.4+fuel/100*0.6;
  f.style.transform=`scale(${0.8+fuel/100*0.4})`;
}

function loop(t){
  const dt=Math.min(.033,(t-last)/1000||.016); last=t;
  if(running) physics(dt);
  draw(); requestAnimationFrame(loop);
}
{const q=probe(p.x); p.y=q.y; p.angle=q.a; camX=p.x-viewW*0.3; camY=p.y-viewH*0.62;}
requestAnimationFrame(loop);
</script>
</body>
</html>
